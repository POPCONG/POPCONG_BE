name: Release Deploy

on:
  push:
    branches: ["release"]
  workflow_dispatch: {}

env:
  AWS_REGION: us-west-2
  ACCOUNT_ID: "590184104064"
  ECR_REPOSITORY: popcong-server

concurrency:
  group: release-deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: true
          context: .
          file: ./Dockerfile
          tags: |
            ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    if: github.ref == 'refs/heads/release'
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Connect & Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY_PEM }}   # PEM 원문 비밀
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -euo pipefail
            
            # 디렉토리 준비
            mkdir -p ~/popcong/config ~/popcong/secrets
            
            echo "[주입] application-prod.yml"
            cat > ~/popcong/config/application-prod.yml <<'EOF_APP_PROD'
            ${{ secrets.APP_PROD_YML }}
            EOF_APP_PROD
            echo "[주입] application-secret.yml"
            cat > ~/popcong/config/application-secret.yml <<'EOF_APP_SECRET'
            ${{ secrets.APP_SECRET_YML }}
            EOF_APP_SECRET
            
            echo "[주입] GCP JSON (base64 -> file)"
            echo "${{ secrets.GCP_CRED_B64 }}" | base64 -d > ~/popcong/secrets/popcong-c9addd5f509d.json
            
            # 권한(컨테이너가 읽기만)
            chmod 640 ~/popcong/config/application-*.yml
            chmod 640 ~/popcong/secrets/popcong-c9addd5f509d.json
            
            # (선택) 코드에서 아직 ClassPathResource 로 JSON을 읽는다면, 아래 한 줄로 classpath에도 마운트되도록 링크
            # ln -sf ~/popcong/secrets/popcong-c9addd5f509d.json ~/popcong/popcong-c9addd5f509d.json || true
            
            # ECR 로그인
            AWS_REGION="${{ env.AWS_REGION }}"
            ACCOUNT_ID="${{ env.ACCOUNT_ID }}"
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
            
            cd ~/popcong
            
            echo "[이미지 Pull]"
            docker compose pull
            
            echo "[재기동]"
            docker compose up -d --remove-orphans
            
            echo "[상태 확인]"
            docker compose ps