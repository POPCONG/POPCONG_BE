name: Release Deploy

on:
  push:
    branches: ["release"]
  workflow_dispatch: {}

env:
  AWS_REGION: us-west-2
  ACCOUNT_ID: "590184104064"
  ECR_REPOSITORY: popcong-server

concurrency:
  group: release-deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: true
          context: .
          file: ./Dockerfile
          tags: |
            ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    if: github.ref == 'refs/heads/release'
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Connect & Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY_PEM }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -euo pipefail
            
            # 환경변수 설정
            AWS_REGION="${{ env.AWS_REGION }}"
            ACCOUNT_ID="${{ env.ACCOUNT_ID }}"
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            
            echo "========================================"
            echo "배포 시작: $(date)"
            echo "========================================"

            echo "[Step 1] ECR 로그인"
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
            
            if [ $? -eq 0 ]; then
                echo "✓ ECR 로그인 성공"
            else
                echo "✗ ECR 로그인 실패"
                exit 1
            fi

            echo "[Step 2] 디렉토리 이동"
            cd ~/popcong
            
            if [ ! -f "docker-compose.yml" ]; then
                echo "✗ docker-compose.yml 파일을 찾을 수 없습니다"
                exit 1
            fi

            echo "[Step 3] 기존 컨테이너 정리"
            docker compose down --remove-orphans || true

            echo "[Step 4] 최신 이미지 Pull"
            docker compose pull
            
            if [ $? -eq 0 ]; then
                echo "✓ 이미지 Pull 성공"
            else
                echo "✗ 이미지 Pull 실패"
                exit 1
            fi

            echo "[Step 5] 컨테이너 시작"
            docker compose up -d --remove-orphans
            
            if [ $? -eq 0 ]; then
                echo "✓ 컨테이너 시작 성공"
            else
                echo "✗ 컨테이너 시작 실패"
                exit 1
            fi

            echo "[Step 6] 상태 확인"
            sleep 5
            docker compose ps
            
            echo "========================================"
            echo "배포 완료: $(date)"
            echo "========================================"