<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Chat REST + WebSocket Test</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding:16px; }
    .row { display:flex; gap:8px; margin-bottom:8px; flex-wrap: wrap; }
    label { font-size:14px; }
    input, button, textarea { font-size:14px; padding:6px 8px; }
    input[type="text"] { min-width: 260px; }
    #log, #history { border:1px solid #ccc; padding:8px; height:220px; overflow:auto; background:#fafafa; white-space:pre-wrap; }
    .section { margin-top:16px; }
  </style>
</head>
<body>

<h2>Chat REST + WebSocket(STOMP) 테스트</h2>

<div class="row">
  <label>Base URL:
    <input id="baseUrl" type="text" value="http://localhost:8080/api/v1" />
  </label>
  <label>WS URL:
    <input id="wsUrl" type="text" value="http://localhost:8080/ws" />
  </label>
</div>

<div class="row">
  <label>Bearer Token:
    <input id="token" type="text" placeholder="eyJhbGciOi..." />
  </label>
</div>

<div class="row">
  <label>Chat ID:
    <input id="chatId" type="text" value="100" />
  </label>
</div>

<div class="row">
  <button id="connectBtn">WebSocket Connect & Subscribe</button>
  <button id="disconnectBtn">Disconnect</button>
  <button id="loadHistoryBtn">Load History (REST)</button>
</div>

<div class="row">
  <label>Message:
    <input id="messageInput" type="text" placeholder="안녕하세요!" />
  </label>
  <button id="sendMsgBtn">Send Message (REST)</button>
</div>

<div class="section">
  <h3>WebSocket Logs</h3>
  <div id="log"></div>
</div>

<div class="section">
  <h3>History (REST)</h3>
  <div id="history"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
  let stomp = null;

  const $ = (id) => document.getElementById(id);
  const log = (m) => {
    const el = $("log");
    el.textContent += m + "\n";
    el.scrollTop = el.scrollHeight;
  };
  const printHistory = (data) => {
    const el = $("history");
    el.textContent = JSON.stringify(data, null, 2);
    el.scrollTop = el.scrollHeight;
  };

  // WebSocket Connect
  $("connectBtn").onclick = () => {
    const wsUrl   = $("wsUrl").value.trim();
    const chatId  = $("chatId").value.trim();
    const token   = $("token").value.trim();

    if (!wsUrl || !chatId || !token) {
      alert("WS URL, Chat ID, Token을 확인하세요.");
      return;
    }

    const sock = new SockJS(wsUrl);
    stomp = Stomp.over(sock);
    stomp.debug = null;

    // 👇 여기서 Authorization 헤더를 전달
    stomp.connect({ Authorization: "Bearer " + token }, () => {
      log("Connected");
      const topic = "/topic/chat." + chatId;
      stomp.subscribe(topic, (frame) => {
        log("RECV: " + frame.body);
      });
      log("Subscribed: " + topic);
    }, (err) => log("ERROR: " + err));
  };

  $("disconnectBtn").onclick = () => {
    if (stomp) {
      stomp.disconnect(() => log("Disconnected"));
      stomp = null;
    }
  };

  // Load History (REST)
  $("loadHistoryBtn").onclick = async () => {
    const baseUrl = $("baseUrl").value.replace(/\/+$/, "");
    const chatId  = $("chatId").value.trim();
    const token   = $("token").value.trim();

    const url = `${baseUrl}/chats/${encodeURIComponent(chatId)}/messages?page=0&size=30`;
    try {
      const res = await fetch(url, {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        }
      });
      const json = await res.json();
      printHistory(json);
      log(`History loaded: status=${res.status}`);
    } catch (e) {
      log("History error: " + e.message);
    }
  };

  // Send Message (REST)
  $("sendMsgBtn").onclick = async () => {
    const baseUrl = $("baseUrl").value.replace(/\/+$/, "");
    const chatId  = $("chatId").value.trim();
    const token   = $("token").value.trim();
    const message = $("messageInput").value;

    if (!message) {
      alert("메시지를 입력하세요.");
      return;
    }

    const url = `${baseUrl}/chats/${encodeURIComponent(chatId)}/messages`;
    try {
      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message })
      });
      const json = await res.json();
      log(`Send result: status=${res.status} body=${JSON.stringify(json)}`);
    } catch (e) {
      log("Send error: " + e.message);
    }
  };
</script>
</body>
</html>
